name: OTA Sales Report

on:
  # Daily schedule (UTC). 01:00 UTC = 08:00 Vietnam time. Adjust as you like.
  schedule:
    - cron: "0 1 * * *"
  # Manual run from the Actions tab.
  workflow_dispatch: {}
  # External trigger (e.g. cron-job.org) via the GitHub API:
  #   POST /repos/<owner>/<repo>/dispatches  { "event_type": "run-report" }
  repository_dispatch:
    types: [run-report]

# Don't let two runs overlap (they share the dedupe cache).
concurrency:
  group: ota-sales-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Restore the dedupe file so bookings aren't re-reported across runs.
      - name: Restore dedupe state
        uses: actions/cache/restore@v4
        with:
          path: state/seenReservations.json
          key: ota-seen-${{ github.run_id }}
          restore-keys: |
            ota-seen-

      - name: Run report
        run: node src/report.js
        env:
          SM_USER: ${{ secrets.SM_USER }}
          SM_PASS: ${{ secrets.SM_PASS }}
          SM_TOTP_SECRET: ${{ secrets.SM_TOTP_SECRET }}
          SM_SPID: ${{ secrets.SM_SPID }}
          SM_DEVICE_TRUST: skip
          SM_HEADFUL: "false"
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}

      # Save the updated dedupe file for the next run.
      - name: Save dedupe state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/seenReservations.json
          key: ota-seen-${{ github.run_id }}
