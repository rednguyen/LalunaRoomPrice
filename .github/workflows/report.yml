name: OTA Sales Report

on:
  # Manual run from the Actions tab. "github" = backup if the VPS is down (report only;
  # no guest emails there, since the trusted SiteMinder profile lives on the VPS).
  workflow_dispatch:
    inputs:
      runner:
        description: "Where to run"
        type: choice
        options: [vps, github]
        default: vps
      zalo:
        description: "Post the reports to Zalo (no = print them in the run log only)"
        type: choice
        options: ["yes", "no"]
        default: "yes"
  # Scheduled trigger comes from cron-job.org via the GitHub API:
  #   POST /repos/<owner>/<repo>/dispatches  { "event_type": "run-report" }
  repository_dispatch:
    types: [run-report]

# Don't let two runs overlap (they both update the dedupe log).
concurrency:
  group: ota-sales-report
  cancel-in-progress: false

jobs:
  report:
    # Normally the Ubuntu VPS (self-hosted runner labelled "laluna", see VPS_SETUP.md).
    runs-on: ${{ inputs.runner == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","laluna"]') }}
    timeout-minutes: 20
    permissions:
      contents: write        # needed to commit the dedupe log back
    env:
      ON_VPS: ${{ inputs.runner != 'github' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # stay on the branch so we can commit/push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # The VPS got Chromium's system libraries once from deploy/vps-setup.sh (needs root);
      # the browser itself is cached after the first run.
      - name: Install Playwright Chromium
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium

      - name: Run report
        run: |
          STATE="${SM_STATE_FILE:-state/storageState.json}"
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            rm -f "$STATE"   # re-check the login each attempt (clears a step-up'd session)
            if node src/report.js; then echo "::endgroup::"; exit 0; fi
            echo "Attempt $attempt failed."
            echo "::endgroup::"
            [ "$attempt" -lt 3 ] && { echo "Retrying in 90s..."; sleep 90; }
          done
          echo "All attempts failed."; exit 1
        env:
          SM_USER: ${{ secrets.SM_USER }}
          SM_PASS: ${{ secrets.SM_PASS }}
          SM_TOTP_SECRET: ${{ secrets.SM_TOTP_SECRET }}
          SM_SPID: ${{ secrets.SM_SPID }}
          SM_DAYS: "450"
          SM_DEVICE_TRUST: skip
          SM_SUCCESS_URL_GLOB: https://platform.siteminder.com/**
          SM_HEADFUL: "false"
          # zalo: no → no token, so src/zalo.js prints the reports instead of posting them.
          # (Cron runs have no inputs: null != 'no', so they always post.)
          ZALO_BOT_TOKEN: ${{ inputs.zalo == 'no' && '' || secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
          # VPS only: the trusted SiteMinder profile (reveals guest emails) + guest emails.
          SM_PROFILE_DIR: ${{ env.ON_VPS == 'true' && '/home/laluna/sm-profile' || '' }}
          SM_STATE_FILE: ${{ env.ON_VPS == 'true' && '/home/laluna/sm-state.json' || '' }}
          GUEST_EMAIL_MODE: ${{ vars.GUEST_EMAIL_MODE || 'dry-run' }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}

      # Persist the dedupe + emailed-guests logs by committing them back to the repo.
      - name: Commit updated dedupe log
        if: always()
        run: |
          for f in state/seenReservations.json state/emailedGuests.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No dedupe changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update dedupe log [skip ci]"
            git pull --rebase && git push
          fi
