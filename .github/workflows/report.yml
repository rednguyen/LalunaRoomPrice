name: OTA Sales Report

on:
  # Manual run from the Actions tab.
  workflow_dispatch: {}
  # Scheduled trigger comes from cron-job.org via the GitHub API:
  #   POST /repos/<owner>/<repo>/dispatches  { "event_type": "run-report" }
  repository_dispatch:
    types: [run-report]

# Don't let two runs overlap (they both update the dedupe log).
concurrency:
  group: ota-sales-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # needed to commit the dedupe log back
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # stay on the branch so we can commit/push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run report
        run: |
          for attempt in 1 2 3; do
            echo "::group::Attempt $attempt"
            rm -f state/storageState.json   # fresh login each attempt (clears a step-up'd session)
            if node src/report.js; then echo "::endgroup::"; exit 0; fi
            echo "Attempt $attempt failed."
            echo "::endgroup::"
            [ "$attempt" -lt 3 ] && { echo "Retrying in 90s..."; sleep 90; }
          done
          echo "All attempts failed."; exit 1
        env:
          SM_USER: ${{ secrets.SM_USER }}
          SM_PASS: ${{ secrets.SM_PASS }}
          SM_TOTP_SECRET: ${{ secrets.SM_TOTP_SECRET }}
          SM_SPID: ${{ secrets.SM_SPID }}
          SM_DAYS: "450"
          SM_DEVICE_TRUST: skip
          SM_HEADFUL: "false"
          ZALO_BOT_TOKEN: ${{ secrets.ZALO_BOT_TOKEN }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}

      # Persist the dedupe log by committing it back to the repo.
      - name: Commit updated dedupe log
        if: always()
        run: |
          if git diff --quiet -- state/seenReservations.json; then
            echo "No dedupe changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/seenReservations.json
            git commit -m "chore: update dedupe log [skip ci]"
            git push
          fi
